[project]
name = "dw-windows-mcp"
version = "0.1.0"
description = "MCP server exposing full Windows 11 control (filesystem, process, registry, services, power, network, installation, GUI automation) over stdio and HTTP/SSE with OAuth2 and role-based access control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Bergfeld" }]

dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=6.0.0",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
dw-windows-mcp = "dw_windows_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_windows_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"
